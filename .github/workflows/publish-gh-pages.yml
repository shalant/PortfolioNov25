name: Publish Blazor App to GitHub Pages

on: [ push, workflow_dispatch ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Restore
      run: dotnet restore .

    - name: Build
      run: dotnet build .

    - name: Test
      run: dotnet test . -c Release

    - name: Publish
      run: dotnet publish src/BlazorApp -c Release -o published

    - name: Rewrite base href
      uses: SteveSandersonMS/ghaction-rewrite-base-href@v1.1.0
      with:
        html_path: published/wwwroot/index.html
        base_href: /

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install prerender tool deps
      working-directory: tools/prerender
      run: npm install

    - name: Install Playwright Chromium
      working-directory: tools/prerender
      run: npx playwright install --with-deps chromium

    - name: Prerender routes for crawlers
      working-directory: tools/prerender
      run: node prerender.mjs ../../published/wwwroot

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: published/wwwroot

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Notify IndexNow (Bing/Yandex instant indexing)
      run: |
        URLS=$(grep -oP '(?<=<loc>)[^<]+' src/BlazorApp/wwwroot/sitemap.xml | jq -R -s -c 'split("\n")[:-1]')
        STATUS=$(curl -s -o /tmp/indexnow_response.txt -w "%{http_code}" -X POST https://api.indexnow.org/indexnow \
          -H "Content-Type: application/json; charset=utf-8" \
          -d "{\"host\":\"dougrosenbergdev.com\",\"key\":\"420c300198134394a823abc04ef8edf8\",\"keyLocation\":\"https://dougrosenbergdev.com/420c300198134394a823abc04ef8edf8.txt\",\"urlList\":$URLS}")
        echo "IndexNow response: HTTP $STATUS"
        cat /tmp/indexnow_response.txt
