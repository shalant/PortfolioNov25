<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="franciscanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1abc9c" />
      <stop offset="100%" stop-color="#16a085" />
    </linearGradient>
    <filter id="franciscanGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
    </filter>
  </defs>

  <!-- Cross - main symbol -->
  <g transform="translate(128, 128)">
    <!-- Vertical beam -->
    <rect x="-8" y="-50" width="16" height="100" fill="url(#franciscanGrad)" filter="url(#franciscanGlow)" rx="4" />

    <!-- Horizontal beam -->
    <rect x="-50" y="-15" width="100" height="30" fill="url(#franciscanGrad)" filter="url(#franciscanGlow)" rx="4" />

    <!-- Rope/cord accent around cross -->
    <circle cx="0" cy="0" r="65" fill="none" stroke="url(#franciscanGrad)" stroke-width="3" opacity="0.6" stroke-dasharray="8,4" />
  </g>

  <!-- Text: Friars -->
  <text x="128" y="220" font-family="'Montserrat', sans-serif" font-size="18" font-weight="500" fill="#eef2f7" text-anchor="middle" letter-spacing="1">
    FRIARS
  </text>
</svg>
