<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background version for light-colored pages -->
  <defs>
    <linearGradient id="darkHexTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="darkHexBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <filter id="darkShadow">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.2"/>
    </filter>
    <style>
      .dark-logo-text { font-family: 'Montserrat', 'Poppins', sans-serif; font-weight: 600; font-size: 24px; fill: #fff; }
    </style>
  </defs>

  <!-- Shadow -->
  <ellipse cx="90" cy="155" rx="40" ry="12" fill="black" opacity="0.15"/>

  <!-- 3D Hexagon -->
  <g filter="url(#darkShadow)">
    <!-- Top face -->
    <polygon points="75,45 120,25 155,50 110,70" fill="url(#darkHexTop)"/>

    <!-- Left face -->
    <polygon points="75,45 75,100 110,120 110,70" fill="#0f1620"/>

    <!-- Right/Bottom face -->
    <polygon points="110,70 110,120 155,100 155,50" fill="url(#darkHexBottom)"/>
  </g>

  <!-- "dr" text in hexagon -->
  <text x="110" y="95" text-anchor="middle" class="dark-logo-text" font-size="32" font-weight="700">dr</text>

  <!-- "codeworks" text (white for dark backgrounds) -->
  <text x="200" y="105" class="dark-logo-text" font-size="26">codeworks</text>
</svg>
