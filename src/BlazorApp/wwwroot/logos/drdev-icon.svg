<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 3D Hexagon Icon (no text) - for favicon/icon use -->
  <defs>
    <linearGradient id="iconHexTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconHexBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1abc9c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a085;stop-opacity:1" />
    </linearGradient>
    <filter id="iconShadow">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <style>
      .icon-text { font-family: 'Montserrat', 'Poppins', sans-serif; font-weight: 700; font-size: 48px; fill: white; }
    </style>
  </defs>

  <!-- Shadow -->
  <ellipse cx="100" cy="165" rx="50" ry="15" fill="black" opacity="0.15"/>

  <!-- 3D Hexagon -->
  <g filter="url(#iconShadow)">
    <!-- Top face -->
    <polygon points="60,50 140,30 180,70 100,90" fill="url(#iconHexTop)"/>

    <!-- Left face -->
    <polygon points="60,50 60,130 100,150 100,90" fill="#0f1620"/>

    <!-- Right/Bottom face -->
    <polygon points="100,90 100,150 180,130 180,70" fill="url(#iconHexBottom)"/>
  </g>

  <!-- "dr" text -->
  <text x="100" y="115" text-anchor="middle" class="icon-text">dr</text>
</svg>
